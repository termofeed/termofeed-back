services:
  back:
    build:
      context: .
      dockerfile: Dockerfile
    image: termofeed-back:local
    container_name: termofeed-back
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "/bin/termofeed", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
